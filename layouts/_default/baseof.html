<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <!-- Подключаем наш Beer CSS -->
  <link rel="stylesheet" href="/css/beer.min.css">
</head>
<body class="dark">

  <!-- Шапка сайта -->
  <header class="primary">
    <nav class="container">
      <h5 class="max">Документация Quazi</h5>
    </nav>
  </header>

  <!-- Основной контент -->
  <main class="responsive padding">
    <article class="card fill surface">
      <!-- Сюда Hugo сам вставит текст из твоих .md файлов -->
      {{ block "main" . }}{{ end }}
    </article>
  </main>

</body>
</html>
